name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-smoke-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMESRAG_ENABLED: "false"
      APPOINTMENT_DECISION_MODE: disabled
      JAKEPILOT_DATABASE_URL: sqlite:///./data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline tests
        run: python -m pytest -q
      - name: Generate smoke evidence
        run: >-
          python -m scripts.run_agent_eval
          --output-dir artifacts/eval/reports
          --work-dir artifacts/eval/work
          --code-revision ${{ github.sha }}
      - name: Upload privacy-minimized smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-smoke-evidence
          path: artifacts/eval/reports/*.json
          if-no-files-found: error
          retention-days: 14
